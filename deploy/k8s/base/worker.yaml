# Two replicas poll the same task queue; Temporal spreads work across them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 2
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      containers:
        - name: worker
          image: temporal-demo:dev
          imagePullPolicy: IfNotPresent
          command: ["/app/worker"]
          env:
            - {name: TEMPORAL_ADDRESS, value: "temporal:7233"}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4317"}
            - {name: OTEL_EXPORTER_OTLP_INSECURE, value: "true"}
            - {name: TRANSIENT_FAILURE_RATE, value: "0.3"}
            - {name: SHIP_SECONDS, value: "10"}
            - name: K8S_POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: K8S_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: K8S_NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.pod.name=$(K8S_POD_NAME),k8s.namespace.name=$(K8S_NAMESPACE),k8s.node.name=$(K8S_NODE_NAME),service.instance.id=$(K8S_POD_NAME)
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
