# Grafana + Tempo + Prometheus + Loki in one container.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgtm
spec:
  replicas: 1
  selector:
    matchLabels: {app: lgtm}
  template:
    metadata:
      labels: {app: lgtm}
    spec:
      containers:
        - name: lgtm
          image: grafana/otel-lgtm:0.37.0
          ports:
            - {name: grafana, containerPort: 3000}
            - {name: otlp-grpc, containerPort: 4317}
          readinessProbe:
            httpGet: {path: /api/health, port: grafana}
            periodSeconds: 5
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {memory: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: lgtm
spec:
  selector: {app: lgtm}
  ports:
    - {name: grafana, port: 3000, targetPort: grafana}
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
