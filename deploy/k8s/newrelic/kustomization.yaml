# Base + New Relic export. Expects Secret "newrelic" with key "license-key"
# (`make k8s-deploy` creates it from NEW_RELIC_LICENSE_KEY).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

patches:
  - target: {kind: Deployment, name: otel-collector}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args/1
        value: --config=/etc/otelcol/newrelic.yaml
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NEW_RELIC_LICENSE_KEY
          valueFrom: {secretKeyRef: {name: newrelic, key: license-key}}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NEW_RELIC_OTLP_ENDPOINT
          valueFrom: {secretKeyRef: {name: newrelic, key: otlp-endpoint, optional: true}}
